spring.application.name=todo
# The PORT environment variable overrides the default 8080
server.port=${PORT:8080}

# H2 database saved to a file, so data survives restarts
spring.datasource.url=jdbc:h2:file:./data/todo
spring.datasource.username=sa
spring.datasource.password=

# Create or update the table automatically
spring.jpa.hibernate.ddl-auto=update

# Browser database viewer at /h2-console (for learning only)
spring.h2.console.enabled=true

logging.level.com.example.todo=INFO